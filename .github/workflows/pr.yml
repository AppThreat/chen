name: pr
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        jvm: ['23', '25', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jvm }}
          cache: "sbt"
      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729  # v1.5.8
      # php2atom's parser shells out to `php`, and install.sh runs `composer`, so PHP is a real
      # test dependency on every OS. All we need of it is those two binaries on PATH: chen ships
      # its own php.ini (PhpParser passes `--php-ini` explicitly), so the ini, tools and coverage
      # machinery setup-php provides is unused.
      # php2atom shells out to `php` and install.sh runs `composer`, so both binaries must be on
      # PATH on every OS. chen supplies its own php.ini (PhpParser passes `--php-ini`), so no ini,
      # extension or coverage setup is required.
      - name: "Install PHP (Linux, Windows)"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          coverage: "none"
          php-version: "8.5"
          tools: composer:v2
        if: runner.os != 'macOS'
      # macOS installs from brew directly rather than through setup-php, which builds macOS PHP
      # from a Homebrew tap and fails the whole job when that tap is broken.
      #
      # `php@8.5` is Homebrew's alias for the current `php` formula and is not keg-only, so it
      # needs no PATH export. Name the version rather than using bare `php`: when 8.6 becomes
      # current, this fails on a missing formula instead of silently testing an unintended PHP.
      - name: "Install PHP (macOS)"
        run: |
          brew install php@8.5 composer
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        if: runner.os == 'macOS'
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '25.x'
      - name: Delete `.rustup` directory
        run: rm -rf /home/runner/.rustup # to save disk space
        if: runner.os == 'Linux'
      - name: Delete `.cargo` directory # to save disk space
        run: rm -rf /home/runner/.cargo
        if: runner.os == 'Linux'
      - name: Install graphviz-dev
        run: sudo apt install -y graphviz-dev
        if: runner.os == 'Linux'
      - name: Install sbt (macOS)
        run: |
          brew install sbt
        if: runner.os == 'macOS'
      - name: Install and test
        run: |
          bash ./platform/frontends/php2atom/install.sh
          npm install -g @appthreat/atom-parsetools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashfiles('**/build.sbt') }}
      - name: Compile and run tests
        run: |
          sbt clean +test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        if: runner.os != 'Windows'
      - name: Compile and run tests
        run: |
          sbt clean +test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        if: runner.os == 'Windows'
